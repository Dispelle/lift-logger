<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Lift Logger</title>
    <!-- Fix 1: Apply theme immediately before CSS to prevent flash -->
    <script>
        (function() {
            var saved = localStorage.getItem('liftLoggerTheme') || 'dark';
            document.documentElement.className = 'theme-' + saved;
        })();
    </script>
    <style>
        /* Fix 1: CSS variables for theming */
        :root {
            --bg: #0a0a0a;
            --bg2: #1a1a1a;
            --bg3: #222;
            --border: #333;
            --text: #fff;
            --text2: #aaa;
            --text3: #888;
            --accent: #00ff00;
            --header-bg: #0a0a0a;
        }
        html.theme-light {
            --bg: #f5f5f5;
            --bg2: #e8e8e8;
            --bg3: #ddd;
            --border: #ccc;
            --text: #111;
            --text2: #444;
            --text3: #666;
            --accent: #009900;
            --header-bg: #f5f5f5;
        }
        html.theme-rainbow {
            --bg: #0a0010;
            --bg2: #150025;
            --bg3: #1a0030;
            --border: #440066;
            --text: #fff;
            --text2: #dd88ff;
            --text3: #aa55cc;
            --accent: #ff00ff;
            --header-bg: #0a0010;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 20px;
        }

        @keyframes rotate-slow {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes rotate-rev {
            from { transform: rotate(0deg); }
            to   { transform: rotate(-360deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.03; }
            50%       { opacity: 0.07; }
        }
        @keyframes rainbow-spin {
            0%   { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* Big plate ring — top right */
        body::before {
            content: '';
            position: fixed;
            top: -60px;
            right: -60px;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            border: 32px solid rgba(0, 255, 80, 0.06);
            box-shadow: inset 0 0 0 12px rgba(0,255,80,0.03),
                        inset 0 0 0 22px rgba(0,255,80,0.015);
            animation: rotate-rev 25s linear infinite, pulse-glow 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        /* Second plate ring — bottom left */
        body::after {
            content: '';
            position: fixed;
            bottom: -80px;
            left: -80px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 24px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 0 0 10px rgba(255,255,255,0.015);
            animation: rotate-rev 18s linear infinite reverse;
            pointer-events: none;
            z-index: 0;
        }

        html.theme-rainbow body::before {
            border-color: rgba(255, 0, 255, 0.2);
            animation: rotate-rev 25s linear infinite, rainbow-spin 3s linear infinite;
        }
        html.theme-rainbow body::after {
            border-color: rgba(0, 255, 255, 0.15);
            animation: rotate-rev 18s linear infinite reverse, rainbow-spin 2s linear infinite;
        }

        /* Barbell bar — horizontal accent across middle */
        .gym-bar {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 8px;
            background: linear-gradient(
                to right,
                transparent 0%,
                rgba(255,255,255,0.04) 15%,
                rgba(255,255,255,0.06) 30%,
                rgba(255,255,255,0.06) 70%,
                rgba(255,255,255,0.04) 85%,
                transparent 100%
            );
            border-radius: 4px;
            pointer-events: none;
            z-index: 0;
            animation: pulse-glow 8s ease-in-out infinite;
        }
        .gym-bar::before, .gym-bar::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 8px solid rgba(255,255,255,0.05);
        }
        .gym-bar::before { left: -50px; }
        .gym-bar::after  { right: -50px; }

        .container { position: relative; z-index: 1; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px;
        }

        header {
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            background: var(--header-bg);
            z-index: 100;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }

        header p {
            font-size: 12px;
            color: var(--text3);
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            background: none;
            border: none;
            color: var(--text3);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* LOG WORKOUT FORM */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text2);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        /* Fix 12: font-size 16px prevents iOS zoom on focus */
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            font-family: inherit;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .exercise-row {
            background: var(--bg2);
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 4px;
            border-left: 3px solid var(--border);
        }

        .exercise-row.pr {
            border-left-color: var(--accent);
        }

        .exercise-row input {
            margin-bottom: 8px;
        }

        .remove-exercise {
            background: var(--bg3);
            color: var(--text3);
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .remove-exercise:hover {
            background: #ff3333;
            color: #fff;
        }

        button.primary {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.primary:hover {
            opacity: 0.85;
        }

        button.secondary {
            width: 100%;
            padding: 12px;
            background: var(--bg2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        button.secondary:hover {
            border-color: var(--accent);
        }

        /* HISTORY */
        .session {
            background: var(--bg2);
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 4px;
            border-left: 3px solid #444;
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .session-date {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
        }

        .session-muscle {
            font-size: 12px;
            color: var(--text3);
            text-transform: uppercase;
            font-weight: 600;
        }

        .session-actions {
            display: flex;
            gap: 4px;
        }

        .session-btn {
            padding: 6px 8px;
            background: var(--bg3);
            border: none;
            color: var(--text2);
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .session-btn:hover {
            background: #444;
            color: var(--text);
        }

        .session-btn.delete:hover {
            background: #ff3333;
            color: #fff;
        }

        .exercise-log {
            margin-bottom: 12px;
        }

        .exercise-name {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 14px;
            color: var(--text);
        }

        .exercise-stats {
            font-size: 13px;
            color: var(--text2);
        }

        .pr-badge {
            display: inline-block;
            background: var(--accent);
            color: #000;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
        }

        .comparison {
            font-size: 11px;
            color: var(--text3);
            margin-top: 4px;
        }

        .comparison.green {
            color: var(--accent);
        }

        .comparison.red {
            color: #ff6b6b;
        }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg2);
            padding: 16px;
            border-radius: 4px;
            border-left: 3px solid var(--accent);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text3);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }

        .exercise-history {
            background: var(--bg2);
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 4px;
        }

        .exercise-history h4 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }

        .history-entry {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .history-entry:last-child {
            border-bottom: none;
        }

        .history-date {
            color: var(--text3);
        }

        .history-weight {
            font-weight: 600;
            color: var(--text);
        }

        .history-weight.pr {
            color: var(--accent);
        }

        /* IMPORT/EXPORT */
        .import-box {
            background: var(--bg2);
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .import-box textarea {
            height: 200px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .note {
            background: var(--bg3);
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--text3);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .success {
            background: #1a3a1a;
            color: #00ff00;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .error {
            background: #3a1a1a;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        /* Fix 13: DATA TAB */
        .data-section {
            background: var(--bg2);
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        .data-section h3 {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text2);
            margin-bottom: 12px;
        }
        .data-stats {
            font-size: 14px;
            color: var(--text3);
            margin-bottom: 16px;
            line-height: 1.8;
        }
        .data-stats strong {
            color: var(--text);
        }

        /* Theme toggle button */
        .theme-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text3);
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .theme-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 12px;
            }

            header {
                padding: 16px 0;
            }

            header h1 {
                font-size: 24px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .tab-btn {
                font-size: 10px;
                padding: 10px 6px;
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text3);
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 12px;
        }

        /* ── SPLIT QUICK-START ── */
        .split-card {
            width: 100%;
            padding: 20px;
            margin-bottom: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-left: 4px solid var(--split-color, #00ff88);
            border-radius: 8px;
            color: #fff;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
        }
        .split-card:hover { background: #222; transform: translateX(4px); }
        .split-icon { font-size: 32px; }
        .split-name { font-size: 20px; font-weight: 700; flex: 1; }
        .split-sub { font-size: 12px; color: #888; }
        .split-add {
            width: 100%; padding: 14px; background: none; border: 1px dashed #444;
            border-radius: 8px; color: #666; font-size: 14px; cursor: pointer; margin-top: 8px;
        }
        .split-add:hover { border-color: #00ff88; color: #00ff88; }
        .split-add-form {
            background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
            padding: 16px; margin-top: 12px;
        }
        .split-add-form input {
            margin-bottom: 8px;
        }
        .back-btn {
            background: none; border: none; color: #888; font-size: 13px;
            cursor: pointer; padding: 0 0 16px 0; display: block;
        }
        .back-btn:hover { color: #fff; }

        /* ── PR BURST ANIMATION ── */
        @keyframes prBurst {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            60%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="gym-bar"></div>
    <div class="container">
        <header>
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                    <h1>🏋️ Lift Logger</h1>
                    <p id="stats-summary"></p>
                    <p style="font-size:10px; color:#444; margin-top:4px;">v3.0 · Aug 5, 2026</p>
                </div>
                <!-- Fix 1: theme toggle + Fix 5: removed auto-reload, kept manual button -->
                <div style="display:flex; gap:4px; margin-top:4px;">
                    <button class="theme-btn" id="theme-btn" onclick="cycleTheme()" title="Toggle theme">🌙</button>
                    <button onclick="location.reload()" style="background:none; border:1px solid var(--border); color:var(--text3); border-radius:4px; padding:6px 10px; font-size:18px; cursor:pointer;" title="Reload app">↻</button>
                </div>
            </div>
        </header>

        <!-- Fix 6: switchTab(tabName, this) on all buttons -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('log', this)">LOG</button>
            <button class="tab-btn" onclick="switchTab('history', this)">HISTORY</button>
            <button class="tab-btn" onclick="switchTab('stats', this)">STATS</button>
            <button class="tab-btn" onclick="switchTab('import', this)">IMPORT</button>
            <!-- Fix 13: DATA tab -->
            <button class="tab-btn" onclick="switchTab('data', this)">DATA</button>
        </div>

        <!-- LOG WORKOUT TAB -->
        <div id="log" class="tab-content active">
            <!-- Split selector (shown when no workout type chosen) -->
            <div id="split-selector" style="padding:20px 0;">
                <p style="color:#666; font-size:13px; margin-bottom:20px; text-transform:uppercase; font-weight:600;">What are we doing today?</p>
                <div id="split-cards"></div>
                <button class="split-add" onclick="showAddSplitForm()">+ Add Workout Type</button>
                <div id="split-add-form" style="display:none;" class="split-add-form">
                    <label style="font-size:11px; color:#888;">NAME</label>
                    <input type="text" id="new-split-name" placeholder="e.g., UPPER" style="margin-bottom:8px;">
                    <label style="font-size:11px; color:#888;">ICON</label>
                    <input type="text" id="new-split-icon" placeholder="e.g., ⚡" style="margin-bottom:8px; max-width:80px;">
                    <label style="font-size:11px; color:#888;">KEYWORDS (comma separated)</label>
                    <input type="text" id="new-split-keywords" placeholder="e.g., upper, press, row" style="margin-bottom:12px;">
                    <button type="button" class="primary" onclick="addSplitType()" style="margin-bottom:8px;">Add</button>
                    <button type="button" class="secondary" onclick="document.getElementById('split-add-form').style.display='none'">Cancel</button>
                </div>
            </div>

            <!-- Workout form (hidden until split chosen) -->
            <div id="workout-form" style="display:none;">
                <button class="back-btn" onclick="showSplitSelector()">&#8592; Change workout type</button>

                <!-- Last session reference card -->
                <div id="last-session-card" style="background:#111; border:1px solid #2a2a2a; border-radius:8px; padding:14px; margin-bottom:16px; display:none;">
                    <div onclick="toggleLastSession()" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                        <span id="last-session-title" style="font-size:12px; color:#888; font-weight:600; text-transform:uppercase;">&#128203; Last session</span>
                        <span id="last-session-toggle" style="color:#666; font-size:14px;">&#9660;</span>
                    </div>
                    <div id="last-session-body" style="display:none; margin-top:12px;"></div>
                </div>

                <form onsubmit="logWorkout(event)">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="workoutDate" required>
                    </div>

                    <div class="form-group">
                        <label>Muscle Group</label>
                        <input type="text" id="muscleGroup" placeholder="e.g., LEGS, CHEST, BACK" required>
                    </div>

                    <div id="exercises-container"></div>

                    <button type="button" class="secondary" onclick="addExerciseRow()">+ ADD EXERCISE</button>

                    <div style="margin-top: 20px;">
                        <button type="submit" class="primary">LOG WORKOUT</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- HISTORY TAB -->
        <div id="history" class="tab-content">
            <div id="history-container"></div>
        </div>

        <!-- STATS TAB -->
        <div id="stats" class="tab-content">
            <div id="stats-container"></div>
        </div>

        <!-- IMPORT TAB -->
        <div id="import" class="tab-content">
            <div class="import-box">
                <label>Paste Your Workout Notes</label>
                <textarea id="importText" placeholder="Paste your 8 months of workouts here..."></textarea>
                <button type="button" class="primary" onclick="importWorkouts()">IMPORT WORKOUTS</button>
            </div>
            <div id="import-status"></div>
        </div>

        <!-- Fix 13: DATA TAB -->
        <div id="data" class="tab-content">
            <div class="data-section">
                <h3>📦 Data Stats</h3>
                <div id="data-stats" class="data-stats">Loading…</div>
            </div>
            <div class="data-section">
                <h3>⬇ Export Backup</h3>
                <p style="font-size:13px; color:var(--text3); margin-bottom:12px;">Download all your workout data as a JSON file.</p>
                <button type="button" class="primary" onclick="exportData()">EXPORT JSON BACKUP</button>
            </div>
            <div class="data-section">
                <h3>⬆ Restore from Backup</h3>
                <p style="font-size:13px; color:var(--text3); margin-bottom:12px;">Select a previously exported JSON file to restore.</p>
                <input type="file" id="restore-file" accept=".json" onchange="importDataFile(this)">
                <div id="data-status" style="margin-top:12px;"></div>
            </div>
        </div>
    </div>

    <script>
        // ─── FIX 1: THEME ──────────────────────────────────────────────────────────
        const THEMES = ['dark', 'light', 'rainbow'];
        const THEME_ICONS = { dark: '🌙', light: '☀️', rainbow: '🌈' };

        function getTheme() {
            return localStorage.getItem('liftLoggerTheme') || 'dark';
        }

        function applyTheme(theme) {
            document.documentElement.className = 'theme-' + theme;
            localStorage.setItem('liftLoggerTheme', theme);
            var btn = document.getElementById('theme-btn');
            if (btn) btn.textContent = THEME_ICONS[theme] || '🌙';
        }

        function cycleTheme() {
            var current = getTheme();
            var next = THEMES[(THEMES.indexOf(current) + 1) % THEMES.length];
            applyTheme(next);
        }

        // Sync button icon on load (theme class already applied by inline head script)
        applyTheme(getTheme());

        // ─── FIX 2: STORAGE (safe load/save with backup) ──────────────────────────
        var STORAGE_KEY = 'liftLoggerData';
        var BACKUP_KEY = 'liftLoggerData_bak';

        function loadData() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) {
                console.warn('Primary data corrupt, trying backup:', e);
                try {
                    var bak = localStorage.getItem(BACKUP_KEY);
                    if (bak) return JSON.parse(bak);
                } catch (e2) {
                    console.error('Backup also failed:', e2);
                }
            }
            return [];
        }

        function saveData(data) {
            // Prevent overwriting real data with empty array
            if (!data || data.length === 0) {
                var existing = loadData();
                if (existing.length > 0) return;
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            // Also write backup
            localStorage.setItem(BACKUP_KEY, JSON.stringify(data));
        }

        // ─── PARSEWEIGHTSMART (exercise-aware plate calculation) ────────────────
        // Exercises where "p" = plates per side on a barbell/plate-loaded machine
        // Total weight = (plates_per_side * 45 * 2) + 45 (bar)
        var PLATE_PER_SIDE_EXERCISES = [
            'incline machine', 'hack squat', 'leg press', 'close leg press',
            'close foot leg press', 'quad press', 'machine row', 'seated calf machine',
            'dip plate machine', 'cable rdl'
        ];

        // Exercises where "p" = total plates hanging (belt, chain, etc.)
        // Total weight = plates * 45 (+ any extra)
        var PLATE_TOTAL_EXERCISES = [
            'weighted dip', 'dip', 'pull up', 'chin up'
        ];

        function parseWeightSmart(notation, exerciseName) {
            if (!notation) return 0;
            notation = String(notation).trim().toLowerCase();
            var normName = normalizeName(exerciseName || '');

            var isPerSide = PLATE_PER_SIDE_EXERCISES.some(function(e) { return normName.includes(normalizeName(e)); });
            var isTotalPlate = PLATE_TOTAL_EXERCISES.some(function(e) { return normName.includes(normalizeName(e)); });

            if (notation.includes('p')) {
                var pMatch = notation.match(/^(\d+\.?\d*)p(\+[\d.+]+)?$/);
                if (pMatch) {
                    var basePlates = parseFloat(pMatch[1]) || 0;
                    var extras = pMatch[2] ? pMatch[2].slice(1).split('+').reduce(function(s, v) { return s + (parseFloat(v) || 0); }, 0) : 0;

                    if (isPerSide) {
                        return (basePlates * 45 + extras) * 2 + 45;
                    } else if (isTotalPlate) {
                        return basePlates * 45 + extras;
                    } else {
                        return basePlates * 45 + extras;
                    }
                }
            }

            if (notation.includes('+') && !notation.includes('p')) {
                return notation.split('+').reduce(function(s, p) { return s + (parseFloat(p.trim()) || 0); }, 0);
            }

            if (notation === 'bw') return 0;

            return parseFloat(notation) || 0;
        }

        // Keep old parseWeight as alias for backwards compat (for manually logged workouts via form)
        function parseWeight(notation) {
            return parseWeightSmart(notation, '');
        }

        // Fix 2: formatWeight guard for null/NaN
        function formatWeight(weight) {
            if (weight == null || isNaN(weight)) return '?';
            if (weight % 45 === 0 && weight >= 45) {
                var plates = weight / 45;
                return plates % 1 === 0 ? Math.floor(plates) + 'p' : plates.toFixed(1) + 'p';
            }
            return weight.toString();
        }

        // ─── FIX 10: XSS ESCAPE HELPER ────────────────────────────────────────────
        function esc(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ─── FIX 9: DATE HELPERS (local time, no UTC shift) ──────────────────────
        function localDateStr(isoStr) {
            var parts = isoStr.split('-');
            return new Date(+parts[0], +parts[1] - 1, +parts[2])
                .toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function todayISO() {
            var d = new Date();
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        }

        // ─── FIX 11: EXERCISE ROWS (counter instead of Date.now) ─────────────────
        var _rowCounter = 0;
        function addExerciseRow() {
            var container = document.getElementById('exercises-container');
            var rowId = 'exercise-' + (++_rowCounter);

            var row = document.createElement('div');
            row.className = 'exercise-row';
            row.id = rowId;
            row.innerHTML =
                '<input type="text" class="exercise-name" placeholder="Exercise name" required>' +
                '<input type="text" class="exercise-weight" placeholder="Weight (e.g., 195, 5p, 1.5p, 45+25, 2p+10)" required>' +
                '<input type="number" class="exercise-reps" placeholder="Reps" min="1" required>' +
                '<input type="number" class="exercise-sets" placeholder="Sets (default 1)" min="1" value="1">' +
                '<textarea class="exercise-notes" placeholder="Notes (optional)" style="height: 60px;"></textarea>' +
                '<button type="button" class="remove-exercise" onclick="document.getElementById(\'' + rowId + '\').remove()">Remove</button>';

            container.appendChild(row);
        }

        // ─── EXERCISE FUZZY MATCHING ────────────────────────────────────────────────
        var EXERCISE_NOISE_WORDS = new Set([
            'cable','machine','seated','standing','incline','decline','overhead',
            'close','wide','narrow','single','double','alternate','alternating',
            'the','a','an','at','with','and','w','band','green','red','bw','lb','lbs'
        ]);

        var EXERCISE_ALIASES = {
            'pushdown': 'tricep rope',
            'rope pushdown': 'tricep rope',
            'tricep pushdown': 'tricep rope',
            'tricep extension': 'tricep rope',
            'tricep press': 'tricep rope',
            '321 lat raise': 'lat raise',
            '321 lateral raise': 'lat raise',
            'lateral raise': 'lat raise',
            'extention': 'extension',
            'naut': 'nautilus',
            'db': 'dumbbell',
            'rdl': 'romanian deadlift',
            'pulldown': 'lat pulldown',
            'face pull': 'rope face pull',
            'hammer': 'hammer curl',
            'preacher': 'preacher curl',
            'ez bar': 'ez curl',
            'v bar': 'vbar',
            'vbar row': 'vbar row',
            'vbar cable': 'vbar row',
            'close leg press': 'leg press close',
            'close foot leg press': 'leg press close',
            'quad press': 'leg press'
        };

        function normalizeName(name) {
            if (!name || typeof name !== 'string') return '';
            var n = name.trim().toLowerCase().replace(/\s+/g, ' ');
            // Apply alias table
            for (var alias in EXERCISE_ALIASES) {
                if (EXERCISE_ALIASES.hasOwnProperty(alias)) {
                    if (n === alias || n.includes(alias)) {
                        n = n.replace(alias, EXERCISE_ALIASES[alias]);
                    }
                }
            }
            // Singularize trailing s on words >4 chars
            n = n.replace(/\b([a-z]{4,})s\b/g, '$1');
            return n.trim();
        }

        function exerciseSimilarity(a, b) {
            var wordsOf = function(str) {
                var words = normalizeName(str).split(' ').filter(function(w) {
                    return w.length > 1 && !EXERCISE_NOISE_WORDS.has(w);
                });
                return new Set(words);
            };
            var wa = wordsOf(a);
            var wb = wordsOf(b);
            var intersection = 0;
            wa.forEach(function(w) { if (wb.has(w)) intersection++; });
            var union = new Set([...wa, ...wb]);
            return union.size === 0 ? 0 : intersection / union.size;
        }

        function getCanonicalName(name, workouts) {
            var norm = normalizeName(name);
            for (var i = 0; i < workouts.length; i++) {
                var w = workouts[i];
                for (var j = 0; j < w.exercises.length; j++) {
                    var ex = w.exercises[j];
                    if (normalizeName(ex.name) === norm) return ex.name;
                    if (exerciseSimilarity(name, ex.name) >= 0.6) return ex.name;
                }
            }
            return name;
        }

        // ─── FIX 4: getPreviousBest (no early return, excludes self by id, fuzzy match) ──
        function getPreviousBest(exerciseName, excludeWorkoutId) {
            var workouts = loadData();
            var targetNorm = normalizeName(exerciseName);
            var best = null;
            var bestDate = null;
            for (var i = 0; i < workouts.length; i++) {
                var workout = workouts[i];
                if (workout.id === excludeWorkoutId) continue;
                for (var j = 0; j < workout.exercises.length; j++) {
                    var ex = workout.exercises[j];
                    if (normalizeName(ex.name) === targetNorm || exerciseSimilarity(ex.name, exerciseName) >= 0.6) {
                        if (best === null || ex.weight > best) {
                            best = ex.weight;
                            bestDate = workout.date;
                        }
                    }
                }
            }
            return best !== null ? { weight: best, date: bestDate } : null;
        }

        // ─── LOG WORKOUT ───────────────────────────────────────────────────────────
        function logWorkout(event) {
            event.preventDefault();

            var date = document.getElementById('workoutDate').value;
            var muscleGroup = document.getElementById('muscleGroup').value.toUpperCase();
            var exercises = [];

            document.querySelectorAll('.exercise-row').forEach(function(row) {
                var name = row.querySelector('.exercise-name').value;
                var weightRaw = row.querySelector('.exercise-weight').value;
                var weight = parseWeightSmart(weightRaw, name);
                var reps = parseInt(row.querySelector('.exercise-reps').value);
                var sets = parseInt(row.querySelector('.exercise-sets').value) || 1;
                var notes = row.querySelector('.exercise-notes').value;
                exercises.push({ name: name, weight: weight, weightRaw: weightRaw, reps: reps, sets: sets, notes: notes });
            });

            if (exercises.length === 0) {
                alert('Add at least one exercise');
                return;
            }

            var workouts = loadData();
            // Fix 3: stable id on each workout
            var newWorkout = {
                id: Date.now() + '-' + Math.random().toString(36).slice(2),
                date: date,
                muscleGroup: muscleGroup,
                exercises: exercises
            };
            workouts.push(newWorkout);
            saveData(workouts);

            // Fire PR animations
            var prDelay = 0;
            exercises.forEach(function(ex) {
                var prev = getPreviousBest(ex.name, newWorkout.id);
                if (!prev || ex.weight > prev.weight) {
                    (function(exName, delay) {
                        setTimeout(function() { firePRAnimation(exName); }, delay);
                    })(ex.name, prDelay);
                    prDelay += 2000;
                }
            });

            // Reset form and go back to split selector
            document.getElementById('muscleGroup').value = '';
            document.getElementById('exercises-container').innerHTML = '';
            _rowCounter = 0;
            // Fix 9: set date with local time
            document.getElementById('workoutDate').value = todayISO();

            currentSplitType = null;
            showSplitSelector();
            alert('Workout logged!');
            displayHistory();
            updateStats();
        }

        // ─── DISPLAY HISTORY ───────────────────────────────────────────────────────
        function displayHistory() {
            var workouts = loadData();
            var container = document.getElementById('history-container');

            if (workouts.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No workouts logged yet. Start by logging your first workout!</p></div>';
                return;
            }

            // Fix 3: use workout.id for delete, not array index on reversed array
            var reversed = workouts.slice().reverse();

            container.innerHTML = reversed.map(function(workout) {
                var exercisesHtml = workout.exercises.map(function(ex) {
                    // Fix 4: pass workout.id as second arg
                    var previous = getPreviousBest(ex.name, workout.id);
                    var isPR = !previous || ex.weight > previous.weight;
                    var comparison = previous && ex.weight !== previous.weight
                        ? (ex.weight > previous.weight ? '↑' : '↓') + ' vs ' + formatWeight(previous.weight) + ' (' + localDateStr(previous.date) + ')'
                        : '';
                    var compClass = (previous && ex.weight > previous.weight) ? 'green' : 'red';

                    return '<div class="exercise-log">' +
                        '<div class="exercise-name">' + esc(ex.name) +
                        (isPR && previous ? ' <span class="pr-badge">🔥 PR</span>' : '') +
                        '</div>' +
                        '<div class="exercise-stats">' +
                        esc(ex.weightRaw ? ex.weightRaw : formatWeight(ex.weight)) + ' × ' + esc(String(ex.reps || 0)) +
                        (ex.sets > 1 ? ' × ' + esc(String(ex.sets)) : '') +
                        '</div>' +
                        (ex.notes ? '<div style="font-size:11px; color:#666; margin-top:4px; font-style:italic;">' + esc(ex.notes) + '</div>' : '') +
                        (comparison ? '<div class="comparison ' + compClass + '">' + esc(comparison) + '</div>' : '') +
                        '</div>';
                }).join('');

                // Fix 3: pass workout.id (escaped) to deleteWorkout
                var safeId = esc(workout.id || '');
                return '<div class="session">' +
                    '<div class="session-header">' +
                    '<div>' +
                    '<div class="session-date">' + esc(localDateStr(workout.date)) + '</div>' +
                    '<div class="session-muscle">' + esc(workout.muscleGroup) + '</div>' +
                    '</div>' +
                    '<div class="session-actions">' +
                    '<button class="session-btn delete" onclick="deleteWorkout(\'' + safeId + '\')">Delete</button>' +
                    '</div>' +
                    '</div>' +
                    exercisesHtml +
                    '</div>';
            }).join('');
        }

        // Fix 3: deleteWorkout filters by id, not splice by index
        function deleteWorkout(id) {
            if (confirm('Delete this workout?')) {
                var workouts = loadData();
                if (id) {
                    workouts = workouts.filter(function(w) { return w.id !== id; });
                }
                saveData(workouts);
                displayHistory();
                updateStats();
            }
        }

        // ─── UPDATE STATS ──────────────────────────────────────────────────────────
        function updateStats() {
            var workouts = loadData();
            var container = document.getElementById('stats-container');
            var summary = document.getElementById('stats-summary');

            if (workouts.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Log some workouts to see stats!</p></div>';
                if (summary) summary.textContent = '';
                return;
            }

            var totalWorkouts = workouts.length;
            var allExercises = {};
            var muscleGroups = {};

            workouts.forEach(function(workout) {
                muscleGroups[workout.muscleGroup] = (muscleGroups[workout.muscleGroup] || 0) + 1;
                workout.exercises.forEach(function(ex) {
                    var canonical = getCanonicalName(ex.name, workouts);
                    var key = normalizeName(canonical);
                    if (!allExercises[key]) {
                        allExercises[key] = { name: canonical, maxWeight: ex.weight, entries: [] };
                    }
                    allExercises[key].maxWeight = Math.max(allExercises[key].maxWeight, ex.weight);
                    allExercises[key].entries.push({ date: workout.date, weight: ex.weight, reps: ex.reps });
                });
            });

            if (summary) summary.textContent = totalWorkouts + ' workouts · ' + Object.keys(allExercises).length + ' exercises';

            var html = '<div class="stats-grid">' +
                '<div class="stat-card"><div class="stat-label">Total Workouts</div><div class="stat-value">' + totalWorkouts + '</div></div>' +
                '<div class="stat-card"><div class="stat-label">Unique Exercises</div><div class="stat-value">' + Object.keys(allExercises).length + '</div></div>' +
                '</div>' +
                '<h3 style="margin:20px 0 12px; font-size:14px; font-weight:700; text-transform:uppercase; color:var(--text3);">Muscle Groups</h3>';

            Object.entries(muscleGroups).forEach(function(entry) {
                html += '<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; color:var(--text);">' +
                    '<span>' + esc(entry[0]) + '</span><span style="color:var(--accent); font-weight:600;">' + entry[1] + '</span></div>';
            });

            html += '<h3 style="margin:20px 0 12px; font-size:14px; font-weight:700; text-transform:uppercase; color:var(--text3);">Exercise Maxes</h3>';

            Object.values(allExercises).sort(function(a, b) { return b.maxWeight - a.maxWeight; }).forEach(function(ex) {
                var recentDate = ex.entries[ex.entries.length - 1] && ex.entries[ex.entries.length - 1].date;
                html += '<div class="exercise-history">' +
                    '<h4>' + esc(ex.name) + '</h4>' +
                    '<div style="font-size:18px; font-weight:700; color:var(--accent); margin-bottom:8px;">' + esc(formatWeight(ex.maxWeight)) + '</div>' +
                    '<div style="font-size:12px; color:var(--text3);">Last logged: ' + (recentDate ? esc(localDateStr(recentDate)) : 'unknown') + '</div>' +
                    '</div>';
            });

            container.innerHTML = html;
        }

        // ─── IMPORT WORKOUTS ───────────────────────────────────────────────────────
        function importWorkouts() {
            var text = document.getElementById('importText').value;
            var statusDiv = document.getElementById('import-status');

            if (!text.trim()) {
                statusDiv.innerHTML = '<div class="error">Please paste your workout notes</div>';
                return;
            }

            try {
                var workouts = parseWorkoutText(text);
                var existingData = loadData();
                var allWorkouts = existingData.concat(workouts);
                saveData(allWorkouts);

                statusDiv.innerHTML = '<div class="success">✓ Imported ' + workouts.length + ' workouts!</div>';
                document.getElementById('importText').value = '';
                setTimeout(function() {
                    displayHistory();
                    updateStats();
                }, 500);
            } catch (e) {
                statusDiv.innerHTML = '<div class="error">Error: ' + esc(e.message) + '</div>';
            }
        }

        // ─── PARSE WORKOUT TEXT ────────────────────────────────────────────────────
        function parseWorkoutText(text) {
            var workouts = [];
            var lines = text.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l; });

            var currentDate = null;
            var currentMuscle = null;
            var currentExercises = [];
            var lastKnownMuscle = null;

            function saveWorkout() {
                if (currentDate && currentExercises.length > 0) {
                    workouts.push({
                        id: currentDate + '-' + Math.random().toString(36).slice(2),
                        date: currentDate,
                        muscleGroup: currentMuscle || lastKnownMuscle || 'UNKNOWN',
                        exercises: currentExercises
                    });
                }
            }

            function parseDate(line) {
                // Standard M/D/YY or M/DD/YY
                var m = line.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);
                if (m) return formatDateParts(m[1], m[2], m[3]);
                // M/D.YY (period separator like 6/11.26)
                m = line.match(/^(\d{1,2})\/(\d{1,2})\.(\d{2})$/);
                if (m) return formatDateParts(m[1], m[2], m[3]);
                // M/D (no year — use current year)
                m = line.match(/^(\d{1,2})\/(\d{1,2})$/);
                if (m) {
                    var yr = new Date().getFullYear().toString().slice(-2);
                    return formatDateParts(m[1], m[2], yr);
                }
                return null;
            }

            function formatDateParts(month, day, yr) {
                var fullYear = parseInt(yr) < 50 ? 2000 + parseInt(yr) : 1900 + parseInt(yr);
                var candidate = new Date(fullYear, parseInt(month) - 1, parseInt(day));
                if (candidate > new Date(Date.now() + 30 * 86400000)) fullYear -= 1;
                return fullYear + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
            }

            function extractMuscleGroup(line) {
                // Strip emojis and normalize
                var stripped = line.replace(/[\u{1F000}-\u{1FFFF}]|[\u{2600}-\u{27FF}]|[\u{FE00}-\u{FEFF}]|\uFE0F|[\u{1F900}-\u{1F9FF}]/gu, '').trim();
                var upper = stripped.toUpperCase();
                var keywords = ['BACK','CHEST','LEGS','SHOULDERS','ARMS','PUSH','PULL','BICEP','TRICEP','GLUTES','ABS','CARDIO','FULL BODY'];
                for (var k = 0; k < keywords.length; k++) {
                    var kw = keywords[k];
                    if (upper.includes(kw)) {
                        if (upper.includes('ACTIVE RECOVERY') || upper.includes('BACKWARDS') || upper.includes('LIGHTER') || upper.includes('RECOVERY')) {
                            return kw + ' (recovery)';
                        }
                        return kw;
                    }
                }
                return null;
            }

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];

                // Skip pure separator lines
                if (/^[-=*]+$/.test(line)) continue;

                // Try date
                var parsedDate = parseDate(line);
                if (parsedDate) {
                    saveWorkout();
                    currentDate = parsedDate;
                    currentMuscle = null;
                    currentExercises = [];
                    continue;
                }

                // Try muscle group
                var muscle = extractMuscleGroup(line);
                if (muscle && currentDate) {
                    currentMuscle = muscle;
                    lastKnownMuscle = muscle;
                    continue;
                }

                // Try exercise line
                if (currentDate) {
                    var exercise = parseExerciseLine(line);
                    if (exercise) currentExercises.push(exercise);
                }
            }

            saveWorkout();
            return workouts;
        }

        // ─── PARSE EXERCISE LINE ───────────────────────────────────────────────────
        function parseExerciseLine(line) {
            // Strip emojis
            line = line.replace(/[\u{1F000}-\u{1FFFF}]|[\u{2600}-\u{27FF}]|[\u{FE00}-\u{FEFF}]|\uFE0F|[\u{1F900}-\u{1F9FF}]/gu, '').trim();

            // Skip pure description lines (no weight pattern at all)
            if (/^(3 sets|[23] sets|bw$|active recovery|incline sit-up|leg raises?\s*\d|incline sit)/i.test(line)) return null;

            // Handle multiple sets on one line (e.g. "80x15. 90x15") — take the LAST set
            if (/\d+x\d+[.\s]+\d+x\d+/.test(line)) {
                var parts = line.split(/[.\s]+(?=\d+x)/);
                line = parts[parts.length - 1].trim();
            }

            // Normalize weight notation variants before parsing
            line = line.replace(/(\d+\.?\d*p)\s+and\s+(\d+)/gi, '$1+$2');
            line = line.replace(/(\d+\.?\d*p)n(\d+)/gi, '$1+$2');
            line = line.replace(/(\d+\.?\d*p)&(\d+)/gi, '$1+$2');
            line = line.replace(/(\d+\.?\d*p)(\s+\d+-\d+)+/gi, function(match, base, rest) {
                var extras = match.match(/\d+-(\d+)/g) || [];
                return base + extras.map(function(e) { return '+' + e.split('-')[1]; }).join('');
            });

            // Normalize reps ranges and trailing notes
            line = line.replace(/(\d+)-\d+\s*(i\s*(think|forget|remember|guess))?/gi, '$1');
            line = line.replace(/\s+(i\s+\w+|super\s+\w+|or\s+\w+\s+i\s+\w+|ish|\d+\s+warmup\s+set|green\s+band|red\s+machine.*|downstairs.*|new\s+pr.*|diff\s+cable.*|1\s+sec\s+pause.*|with\s+band.*)$/gi, '');

            // Pattern 1: name weight x reps
            var match = line.match(/^([a-z][a-z\s/()'-]*?)\s{1,}([0-9p.+\-]+(?:\+[0-9]+)*)\s*x\s*(\d+\.?\d*)\s*(.*)$/i);
            // Pattern 2: name weight reps (no x)
            if (!match) match = line.match(/^([a-z][a-z\s/()'-]*?)\s{2,}([0-9p.+]+)\s+(\d+)\s*(.*)$/i);
            // Pattern 3: name +weight x reps (weighted dips with + prefix)
            if (!match) match = line.match(/^([a-z][a-z\s/()'-]*?)\s+\+([0-9]+)\s*x\s*(\d+)\s*(.*)$/i);

            if (match) {
                var name = match[1].trim();
                var weightStr = match[2] ? match[2].trim() : match[2];
                var reps = Math.floor(parseFloat(match[3])) || 0;
                var notes = (match[4] || '').trim();

                // Skip if name is very short or looks like a date
                if (name.length < 2) return null;
                if (/^\d+\/\d+/.test(name)) return null;

                var weight = parseWeightSmart(weightStr, name);
                if (isNaN(weight) || weight <= 0) return null;

                return { name: name, weight: weight, weightRaw: weightStr, reps: reps, sets: 1, notes: notes };
            }

            return null;
        }

        // ─── FORMAT DATE STRING (kept for backwards compat) ───────────────────────
        function formatDateString(dateStr) {
            var parts = dateStr.split('/');
            var month = parts[0], day = parts[1], year = parts[2];
            var fullYear = parseInt(year) < 50 ? 2000 + parseInt(year) : 1900 + parseInt(year);
            var candidate = new Date(fullYear, parseInt(month) - 1, parseInt(day));
            if (candidate > new Date(Date.now() + 30 * 86400000)) {
                fullYear -= 1;
            }
            return fullYear + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        }

        // ─── FIX 6: switchTab with explicit btn param ──────────────────────────────
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
            document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
            document.getElementById(tabName).classList.add('active');
            btn.classList.add('active');

            if (tabName === 'history') displayHistory();
            else if (tabName === 'stats') updateStats();
            else if (tabName === 'data') updateDataTab();
            else if (tabName === 'log') { renderSplitCards(); }
        }

        // ─── FIX 13: DATA TAB ─────────────────────────────────────────────────────
        function updateDataTab() {
            var workouts = loadData();
            var statsDiv = document.getElementById('data-stats');
            var raw = localStorage.getItem(STORAGE_KEY) || '[]';
            var kb = (new Blob([raw]).size / 1024).toFixed(1);
            statsDiv.innerHTML = '<strong>' + workouts.length + '</strong> workouts stored &nbsp;·&nbsp; <strong>' + kb + ' KB</strong> used';
        }

        function exportData() {
            var data = loadData();
            var json = JSON.stringify(data, null, 2);
            var blob = new Blob([json], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'liftlogger-backup-' + todayISO() + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importDataFile(input) {
            var file = input.files[0];
            if (!file) return;
            var statusDiv = document.getElementById('data-status');
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var imported = JSON.parse(e.target.result);
                    if (!Array.isArray(imported)) throw new Error('Invalid backup format — expected a JSON array');
                    var existing = loadData();
                    if (existing.length > 0) {
                        if (!confirm('You have ' + existing.length + ' existing workouts. Replace with ' + imported.length + ' from backup? This will overwrite your current data.')) {
                            input.value = '';
                            return;
                        }
                    }
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(imported));
                    localStorage.setItem(BACKUP_KEY, JSON.stringify(imported));
                    statusDiv.innerHTML = '<div class="success">✓ Restored ' + imported.length + ' workouts from backup!</div>';
                    updateDataTab();
                    input.value = '';
                } catch (err) {
                    statusDiv.innerHTML = '<div class="error">Error: ' + esc(err.message) + '</div>';
                }
            };
            reader.readAsText(file);
        }

        // ─── SPLIT QUICK-START ───────────────────────────────────────────────────────
        var DEFAULT_SPLIT = [
            { name: 'PUSH',  icon: '💪', keywords: ['chest','push','shoulders','tricep','bicep'], color: '#ff6b35' },
            { name: 'LEGS',  icon: '🦵', keywords: ['legs','lower','quad','hamstring','glute','calf'], color: '#4a9eff' },
            { name: 'PULL',  icon: '🏋️', keywords: ['back','pull','lat','row','rear'], color: '#00ff88' },
            { name: 'OTHER', icon: '⚡', keywords: [], color: '#888' }
        ];

        var currentSplitType = null;

        function getSplit() {
            try {
                var saved = localStorage.getItem('liftLoggerSplit');
                if (saved) return JSON.parse(saved);
            } catch(e) {}
            return DEFAULT_SPLIT;
        }

        function saveSplit(split) {
            localStorage.setItem('liftLoggerSplit', JSON.stringify(split));
        }

        function getDaysAgo(dateStr) {
            if (!dateStr) return null;
            var parts = dateStr.split('-');
            var d = new Date(+parts[0], +parts[1]-1, +parts[2]);
            return Math.floor((Date.now() - d.getTime()) / 86400000);
        }

        function findLastWorkout(splitName) {
            var split = getSplit().find(function(s) { return s.name === splitName; });
            if (!split) return null;
            var workouts = loadData();
            for (var i = workouts.length - 1; i >= 0; i--) {
                var w = workouts[i];
                var mg = (w.muscleGroup || '').toLowerCase();
                if (mg.includes(splitName.toLowerCase())) return w;
                if (split.keywords.some(function(k) { return mg.includes(k); })) return w;
            }
            return null;
        }

        function renderSplitCards() {
            var container = document.getElementById('split-cards');
            if (!container) return;
            var split = getSplit();
            container.innerHTML = split.map(function(s) {
                var lastW = findLastWorkout(s.name);
                var sub = '';
                if (lastW) {
                    var days = getDaysAgo(lastW.date);
                    var exCount = lastW.exercises.length;
                    sub = 'Last: ' + (days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago') +
                          ' · ' + exCount + ' exercise' + (exCount !== 1 ? 's' : '');
                } else {
                    sub = 'No sessions logged yet';
                }
                return '<button class="split-card" style="--split-color:' + esc(s.color) + '" onclick="startWorkout(' + JSON.stringify(s.name) + ')">' +
                    '<span class="split-icon">' + esc(s.icon) + '</span>' +
                    '<span class="split-name">' + esc(s.name) + '</span>' +
                    '<span class="split-sub">' + esc(sub) + '</span>' +
                    '</button>';
            }).join('');
        }

        function startWorkout(splitName) {
            currentSplitType = splitName;
            document.getElementById('split-selector').style.display = 'none';
            document.getElementById('workout-form').style.display = 'block';
            document.getElementById('muscleGroup').value = splitName;
            document.getElementById('workoutDate').value = todayISO();
            document.getElementById('exercises-container').innerHTML = '';
            _rowCounter = 0;

            var lastW = findLastWorkout(splitName);
            if (lastW) {
                var splitObj = getSplit().find(function(s) { return s.name === splitName; }) || { icon: '' };
                var days = getDaysAgo(lastW.date);
                document.getElementById('last-session-title').innerHTML =
                    '&#128203; Last ' + esc(splitObj.icon + ' ' + splitName) + ' — ' +
                    esc(localDateStr(lastW.date)) + ' · ' + esc(String(lastW.exercises.length)) + ' exercises';
                var bodyHtml = lastW.exercises.map(function(ex) {
                    return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid #1a1a1a;">' +
                        '<span style="color:#aaa;">' + esc(ex.name) + '</span>' +
                        '<span style="color:#666;">' + esc(ex.weightRaw || formatWeight(ex.weight)) + ' × ' + esc(String(ex.reps)) + '</span>' +
                        '</div>';
                }).join('');
                document.getElementById('last-session-body').innerHTML = bodyHtml;
                document.getElementById('last-session-card').style.display = 'block';

                lastW.exercises.forEach(function(ex) {
                    var cont = document.getElementById('exercises-container');
                    var rowId = 'exercise-' + (++_rowCounter);
                    var row = document.createElement('div');
                    row.className = 'exercise-row';
                    row.id = rowId;
                    row.innerHTML =
                        '<input type="text" class="exercise-name" placeholder="Exercise name" value="' + esc(ex.name) + '" required>' +
                        '<input type="text" class="exercise-weight" placeholder="' + esc(ex.weightRaw || formatWeight(ex.weight)) + '" required>' +
                        '<input type="number" class="exercise-reps" placeholder="' + esc(String(ex.reps || 0)) + '" min="1" required>' +
                        '<input type="number" class="exercise-sets" placeholder="Sets (default 1)" min="1" value="1">' +
                        '<textarea class="exercise-notes" placeholder="Notes (optional)" style="height:60px;"></textarea>' +
                        '<button type="button" class="remove-exercise" onclick="document.getElementById(\'' + rowId + '\').remove()">Remove</button>';
                    cont.appendChild(row);
                });
            } else {
                document.getElementById('last-session-card').style.display = 'none';
                addExerciseRow();
            }
        }

        function showSplitSelector() {
            currentSplitType = null;
            document.getElementById('split-selector').style.display = 'block';
            document.getElementById('workout-form').style.display = 'none';
            document.getElementById('last-session-card').style.display = 'none';
            renderSplitCards();
        }

        function toggleLastSession() {
            var body = document.getElementById('last-session-body');
            var toggle = document.getElementById('last-session-toggle');
            if (body.style.display === 'none') {
                body.style.display = 'block';
                toggle.innerHTML = '&#9650;';
            } else {
                body.style.display = 'none';
                toggle.innerHTML = '&#9660;';
            }
        }

        function showAddSplitForm() {
            document.getElementById('split-add-form').style.display = 'block';
        }

        function addSplitType() {
            var name = (document.getElementById('new-split-name').value || '').trim().toUpperCase();
            var icon = (document.getElementById('new-split-icon').value || '').trim() || '⚡';
            var kwStr = (document.getElementById('new-split-keywords').value || '').trim();
            if (!name) { alert('Enter a name for the workout type'); return; }
            var keywords = kwStr ? kwStr.split(',').map(function(k) { return k.trim().toLowerCase(); }).filter(Boolean) : [];
            var split = getSplit();
            split.push({ name: name, icon: icon, keywords: keywords, color: '#888' });
            saveSplit(split);
            document.getElementById('new-split-name').value = '';
            document.getElementById('new-split-icon').value = '';
            document.getElementById('new-split-keywords').value = '';
            document.getElementById('split-add-form').style.display = 'none';
            renderSplitCards();
        }

        // ─── PR BURST ANIMATION ─────────────────────────────────────────────────────────
        function firePRAnimation(exerciseName) {
            var burst = document.createElement('div');
            burst.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;pointer-events:none;text-align:center;animation:prBurst 1.8s ease-out forwards;';
            burst.innerHTML =
                '<div style="font-size:48px;margin-bottom:8px;">🔥</div>' +
                '<div style="font-size:22px;font-weight:800;color:#00ff44;text-shadow:0 0 20px #00ff44;letter-spacing:2px;">NEW PR</div>' +
                '<div style="font-size:14px;color:#aaa;margin-top:6px;">' + esc(exerciseName) + '</div>';
            document.body.appendChild(burst);
            setTimeout(function() { if (burst.parentNode) burst.remove(); }, 1800);

            for (var i = 0; i < 12; i++) {
                (function(idx) {
                    var p = document.createElement('div');
                    p.style.cssText = 'position:fixed;top:50%;left:50%;width:8px;height:8px;border-radius:50%;background:#00ff44;z-index:9998;pointer-events:none;';
                    document.body.appendChild(p);
                    var angle = (idx / 12) * 360;
                    var dist = 80 + Math.random() * 60;
                    var rad = (angle * Math.PI) / 180;
                    var tx = Math.cos(rad) * dist;
                    var ty = Math.sin(rad) * dist;
                    p.animate([
                        { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
                        { transform: 'translate(calc(-50% + ' + tx + 'px), calc(-50% + ' + ty + 'px)) scale(0)', opacity: 0 }
                    ], { duration: 1200, easing: 'ease-out', fill: 'forwards' });
                    setTimeout(function() { if (p.parentNode) p.remove(); }, 1200);
                })(i);
            }
        }

        // ─── FIX 14: CROSS-TAB SYNC ───────────────────────────────────────────────
        window.addEventListener('storage', function(e) {
            if (e.key === STORAGE_KEY) {
                try { displayHistory(); updateStats(); } catch (err) {}
            }
        });

        // ─── INITIALIZE ────────────────────────────────────────────────────────────
        // Fix 9: set today's date using local time
        document.getElementById('workoutDate').value = todayISO();

        // Show split selector on initial load
        renderSplitCards();
        try { displayHistory(); } catch(e) { console.error('History error:', e); }
        try { updateStats(); } catch(e) { console.error('Stats error:', e); }
    </script>
</body>
</html>
